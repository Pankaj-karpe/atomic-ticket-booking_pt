name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Backend ---
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/atomic-tickets-pt:${{ steps.vars.outputs.sha_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/atomic-tickets-pt:latest

      # --- Frontend ---
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/atomic-tickets-fe-pt:${{ steps.vars.outputs.sha_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/atomic-tickets-fe-pt:latest


  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: Pankaj-karpe/atomic-tickets-manifests
          token: ${{ secrets.MANIFESTS_REPO_PAT }}
          path: manifests

      - name: Update image tags
        run: |
          cd manifests
          sed -i "s|image: .*atomic-tickets-pt:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/atomic-tickets-pt:${{ needs.build-and-push.outputs.sha_tag }}|" backend.yml worker.yml beat.yml
          sed -i "s|image: .*atomic-tickets-fe-pt:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/atomic-tickets-fe-pt:${{ needs.build-and-push.outputs.sha_tag }}|" frontend.yml

      - name: Commit and push updated manifests
        run: |
          cd manifests
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update image tags to ${{ needs.build-and-push.outputs.sha_tag }}" || echo "No changes"
          git push








          
